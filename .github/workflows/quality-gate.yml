# Quality gate: compilación (MSVC) y análisis estático (cppcheck)
# Se ejecuta en cada push a desarrollo y en cada pull request a calidad o master.

name: Quality gate

on:
  push:
    branches: [desarrollo]
  pull_request:
    branches: [calidad, master]
  workflow_dispatch:

jobs:
  compilar:
    name: Compilar (Windows / MSVC)
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      # Guarda SDL3 ya descargado entre ejecuciones para no bajarlo cada vez
      - name: Caché de dependencias (SDL3)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configurar con CMake
        run: cmake -S . -B build

      - name: Compilar
        run: cmake --build build --config Debug --target chip8

  analisis:
    name: Análisis estático (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Informativo: no hace fallar el gate
      - name: cppcheck - sugerencias (informativo)
        run: >
          cppcheck src
          --std=c++20
          --language=c++
          --enable=performance,portability
          --inline-suppr
          --suppress=missingIncludeSystem
          --suppress=missingInclude
          --template="{file}:{line}: [{severity}] {message} ({id})"

      # Bloqueante: cualquier aviso hace fallar el gate
      - name: cppcheck - errores y avisos (bloqueante)
        run: >
          cppcheck src
          --std=c++20
          --language=c++
          --enable=warning
          --error-exitcode=1
          --inline-suppr
          --suppress=missingIncludeSystem
          --suppress=missingInclude
          --template="{file}:{line}: [{severity}] {message} ({id})"
